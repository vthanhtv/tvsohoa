<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOV Radio</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; height: 100vh; overflow: hidden; }

    .app-layout { display: flex; width: 100vw; height: 100vh; }

    /* Khung Player bên trái */
    .left-column { flex: 1; display: flex; flex-direction: column; background: #000; overflow: hidden; }
    .video-container { flex: 1; position: relative; background: #050505; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: contain; }

    /* Thanh danh sách kênh dưới Player */
    .channel-bar-wrapper { 
      height: 90px; 
      background: #181818; 
      display: flex; 
      align-items: center; 
      border-top: 1px solid #333; 
      padding: 0 5px; 
      width: 100%; 
    }
    .channel-list { 
      display: flex; 
      gap: 8px; 
      overflow-x: auto; 
      scroll-behavior: smooth; 
      width: 100%; 
      height: 100%; 
      align-items: center; 
      padding: 0 5px; 
      scrollbar-width: none; 
    }
    .channel-list::-webkit-scrollbar { display: none; }
    
    .channel-card { 
      min-width: 105px; 
      height: 70px; 
      background: #252525; 
      border-radius: 6px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      transition: 0.2s; 
      padding: 4px; 
      text-align: center; 
      border: 2px solid transparent; 
      flex-shrink: 0; 
    }
    .channel-card:hover, .channel-card.active { border-color: #ff3b30; background: #333; }
    .channel-card img { max-height: 32px; max-width: 75px; object-fit: contain; margin-bottom: 4px; }
    .channel-card span { font-size: 11px; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

    .scroll-btn { 
      background: rgba(0, 0, 0, 0.8); 
      color: white; 
      border: none; 
      font-size: 16px; 
      width: 28px; 
      height: 100%; 
      cursor: pointer; 
      z-index: 10; 
    }
    .scroll-btn:hover { background: #ff3b30; }

    /* Cột Lịch phát sóng & Nghe lại bên phải */
    .right-column { 
      width: 340px; 
      background: #1a1a1a; 
      border-left: 1px solid #333; 
      display: flex; 
      flex-direction: column; 
    }
    
    .epg-header {
      padding: 12px;
      background: #222;
      border-bottom: 1px solid #333;
    }
    .epg-title { font-size: 15px; font-weight: bold; color: #ff3b30; margin-bottom: 8px; }
    
    /* Thanh chọn ngày (Hôm qua / Hôm nay) */
    .date-selector { display: flex; gap: 5px; }
    .date-btn {
      flex: 1;
      padding: 6px;
      font-size: 12px;
      background: #333;
      color: #ccc;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
    }
    .date-btn.active { background: #ff3b30; color: #fff; font-weight: bold; }

    .epg-list { flex: 1; padding: 10px; overflow-y: auto; }
    
    .epg-item { 
      background: #262626; 
      padding: 10px; 
      margin-bottom: 6px; 
      border-radius: 5px; 
      border-left: 3px solid #555; 
      cursor: pointer;
      transition: 0.2s;
    }
    .epg-item:hover { background: #333; }
    .epg-item.now { border-left-color: #ff3b30; background: #2a1818; }
    .epg-time { font-size: 11px; color: #aaa; margin-bottom: 3px; display: flex; justify-content: space-between; }
    .epg-name { font-size: 13px; font-weight: bold; }
    .badge-play { background: #ff3b30; color: #fff; padding: 1px 4px; border-radius: 3px; font-size: 9px; }

    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .right-column { width: 100%; height: 260px; }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <div class="left-column">
      <div class="video-container">
        <video id="video" controls autoplay></video>
      </div>

      <div class="channel-bar-wrapper">
        <button class="scroll-btn" onclick="scrollChannels(-250)">&#10094;</button>
        <div class="channel-list" id="channelList"></div>
        <button class="scroll-btn" onclick="scrollChannels(250)">&#10095;</button>
      </div>
    </div>

    <div class="right-column">
      <div class="epg-header">
        <div class="epg-title" id="epgChannelTitle">Lịch Nghe VOV</div>
        <div class="date-selector">
          <button class="date-btn" id="btnYesterday" onclick="switchDate('yesterday')">Hôm qua</button>
          <button class="date-btn active" id="btnToday" onclick="switchDate('today')">Hôm nay</button>
        </div>
      </div>
      <div class="epg-list" id="epgContainer">Đang tải lịch...</div>
    </div>
  </div>

  <script>
    const M3U_URL = 'tvpro.m3u';
    const EPG_URL = 'epg.xml';

    let channels = [];
    let rawXmlDoc = null;
    let hls = null;
    let selectedChannel = null;
    let currentDateMode = 'today'; // 'today' hoặc 'yesterday'

    const video = document.getElementById('video');
    const channelList = document.getElementById('channelList');
    const epgContainer = document.getElementById('epgContainer');
    const epgChannelTitle = document.getElementById('epgChannelTitle');

    // 1. Tải XML
    async function loadEPG() {
      try {
        const res = await fetch(EPG_URL);
        if (res.ok) {
          const text = await res.text();
          rawXmlDoc = new DOMParser().parseFromString(text, "text/xml");
        }
      } catch (e) { console.error("Lỗi EPG:", e); }
    }

    // 2. Tải Playlist
    async function loadPlaylist() {
      try {
        const res = await fetch(M3U_URL);
        const text = await res.text();
        const lines = text.split("\n");
        let current = {};

        lines.forEach(line => {
          line = line.trim();
          if (line.startsWith("#EXTINF:")) {
            const idMatch = line.match(/tvg-id="([^"]*)"/);
            const logoMatch = line.match(/tvg-logo="([^"]*)"/);
            const nameParts = line.split(",");

            current = {
              id: idMatch ? idMatch[1] : "",
              name: nameParts[1] ? nameParts[1].trim() : "Kênh VOV",
              logo: logoMatch ? logoMatch[1] : ""
            };
          } else if (line && !line.startsWith("#")) {
            current.url = line;
            channels.push(current);
            current = {};
          }
        });

        renderChannels();
        if (channels.length > 0) playChannel(0);
      } catch (e) { console.error("Lỗi Playlist:", e); }
    }

    function renderChannels() {
      channelList.innerHTML = "";
      channels.forEach((ch, i) => {
        const card = document.createElement("div");
        card.className = `channel-card ${i === 0 ? 'active' : ''}`;
        card.onclick = () => playChannel(i);
        card.innerHTML = `
          ${ch.logo ? `<img src="${ch.logo}" alt="" onerror="this.style.display='none'">` : ''}
          <span>${ch.name}</span>
        `;
        channelList.appendChild(card);
      });
    }

    function playChannel(index) {
      document.querySelectorAll('.channel-card').forEach((card, i) => {
        card.classList.toggle('active', i === index);
      });

      selectedChannel = channels[index];
      epgChannelTitle.textContent = selectedChannel.name;

      playStream(selectedChannel.url);
      displayEPG();
    }

    function playStream(url) {
      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    // 3. Lọc lịch EPG theo Ngày (Hôm nay / Hôm qua)
    function switchDate(mode) {
      currentDateMode = mode;
      document.getElementById('btnYesterday').classList.toggle('active', mode === 'yesterday');
      document.getElementById('btnToday').classList.toggle('active', mode === 'today');
      displayEPG();
    }

    function displayEPG() {
      epgContainer.innerHTML = "";
      if (!rawXmlDoc || !selectedChannel) {
        epgContainer.innerHTML = "<div style='color:#888;'>Không có lịch.</div>";
        return;
      }

      const key = (selectedChannel.id || selectedChannel.name).toLowerCase().replace(/[^a-z0-9]/g, '');
      const channelNodes = Array.from(rawXmlDoc.querySelectorAll("channel"));
      let matchedId = null;

      for (let node of channelNodes) {
        const cId = node.getAttribute("id") || "";
        const cName = node.querySelector("display-name") ? node.querySelector("display-name").textContent : "";
        if (cId.toLowerCase().replace(/[^a-z0-9]/g, '').includes(key) || 
            cName.toLowerCase().replace(/[^a-z0-9]/g, '').includes(key)) {
          matchedId = cId;
          break;
        }
      }

      if (!matchedId) {
        epgContainer.innerHTML = "<div style='color:#888;'>Kênh này chưa hỗ trợ EPG.</div>";
        return;
      }

      const progs = Array.from(rawXmlDoc.querySelectorAll(`programme[channel="${matchedId}"]`));
      const targetDate = new Date();
      if (currentDateMode === 'yesterday') {
        targetDate.setDate(targetDate.getDate() - 1);
      }

      const filteredProgs = progs.filter(p => {
        const pDate = parseXMLTime(p.getAttribute("start"));
        return pDate.toDateString() === targetDate.toDateString();
      });

      if (filteredProgs.length === 0) {
        epgContainer.innerHTML = "<div style='color:#888;'>Không có lịch phát sóng cho ngày này.</div>";
        return;
      }

      const now = new Date();

      filteredProgs.forEach(p => {
        const startStr = p.getAttribute("start");
        const stopStr = p.getAttribute("stop");
        const title = p.querySelector("title") ? p.querySelector("title").textContent : "N/A";

        const startTime = parseXMLTime(startStr);
        const stopTime = parseXMLTime(stopStr);
        const isNow = now >= startTime && now <= stopTime;

        const item = document.createElement("div");
        item.className = `epg-item ${isNow ? 'now' : ''}`;
        
        // Bấm vào chương trình cũ để thử phát lại (Catchup / Seeking)
        item.onclick = () => playCatchup(startTime, selectedChannel.url);

        item.innerHTML = `
          <div class="epg-time">
            <span>${formatHHmm(startTime)} - ${formatHHmm(stopTime)}</span>
            ${isNow ? '<span class="badge-play">ĐANG PHÁT</span>' : '<span style="color:#888;">Nghe lại</span>'}
          </div>
          <div class="epg-name">${title}</div>
        `;
        epgContainer.appendChild(item);
      });
    }

    // Hàm gọi luồng nghe lại dựa theo timestamp (Catchup HLS)
    function playCatchup(startTime, baseUrl) {
      // Chuyển timestamp sang định dạng UTC Flussonic/Akamai Catchup nếu server VOV hỗ trợ
      const utcSeconds = Math.floor(startTime.getTime() / 1000);
      let catchupUrl = baseUrl;

      if (baseUrl.includes('.m3u8')) {
        if (baseUrl.includes('?')) {
          catchupUrl += `&utc=${utcSeconds}`;
        } else {
          catchupUrl += `?utc=${utcSeconds}`;
        }
      }
      console.log("Đang phát luồng:", catchupUrl);
      playStream(catchupUrl);
    }

    function parseXMLTime(str) {
      if (!str || str.length < 12) return new Date();
      const Y = str.substr(0,4), M = str.substr(4,2)-1, D = str.substr(6,2);
      const h = str.substr(8,2), m = str.substr(10,2), s = str.substr(12,2) || '00';
      return new Date(Y, M, D, h, m, s);
    }

    function formatHHmm(date) {
      return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
    }

    function scrollChannels(amount) {
      channelList.scrollBy({ left: amount, behavior: 'smooth' });
    }

    (async function init() {
      await loadEPG();
      await loadPlaylist();
    })();
  </script>
</body>
</html>
