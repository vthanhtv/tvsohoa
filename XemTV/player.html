<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Phát Truyền Hình & Radio</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout chính */
        .main-container { flex: 1; display: flex; flex-direction: column; background: #000; }
        .video-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; height: 100%; max-height: 100vh; }
        
        /* Danh sách kênh bên phải */
        .sidebar { width: 320px; background: #1e293b; display: flex; flex-direction: column; border-left: 1px solid #334155; }
        .sidebar-header { padding: 15px; background: #0f172a; font-size: 1.1rem; font-weight: bold; border-bottom: 1px solid #334155; }
        .channel-list { flex: 1; overflow-y: auto; padding: 10px; }
        
        /* Item kênh */
        .channel-card { display: flex; align-items: center; padding: 10px; margin-bottom: 8px; background: #334155; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        .channel-card:hover, .channel-card.active { background: #2563eb; }
        .channel-card img { width: 45px; height: 30px; object-fit: contain; margin-right: 12px; background: #fff; border-radius: 4px; padding: 2px; }
        .channel-info { overflow: hidden; }
        .channel-name { font-size: 0.95rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-group { font-size: 0.75rem; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="video-wrapper">
            <video id="videoPlayer" controls autoplay></video>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">Danh Sách Kênh</div>
        <div class="channel-list" id="channelList"></div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const channelListContainer = document.getElementById('channelList');
        let hlsPlayer = null;

        // Cấu hình tối ưu bộ nhớ RAM cho Smart TV
        const tvHlsConfig = {
            maxBufferLength: 15,
            maxMaxBufferLength: 30,
            maxBufferSize: 10 * 1024 * 1024, // 10MB
            backBufferLength: 10,
            liveSyncDurationCount: 3
        };

        // Hàm phát kênh HLS
        function playStream(url) {
            if (Hls.isSupported()) {
                if (hlsPlayer) {
                    hlsPlayer.destroy();
                }
                hlsPlayer = new Hls(tvHlsConfig);
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Cần tương tác để phát: ", e));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Hỗ trợ Safari / iOS
                video.src = url;
                video.play();
            }
        }

        // Hàm đọc và Render file M3U
        async function loadM3U() {
            try {
                const response = await fetch('tvpro.m3u');
                const text = await response.text();
                const channels = parseM3U(text);
                
                renderChannels(channels);
                if(channels.length > 0) {
                    playStream(channels[0].url); // Tự động phát kênh đầu tiên
                }
            } catch (err) {
                console.error("Lỗi khi tải danh sách M3U:", err);
            }
        }

        // Cắt văn bản M3U thành Object
        function parseM3U(m3uText) {
            const lines = m3uText.split('\n');
            const channels = [];
            let currentChannel = {};

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="(.*?)"/);
                    const groupMatch = line.match(/group-title="(.*?)"/);
                    const nameMatch = line.split(',')[1];

                    currentChannel = {
                        logo: logoMatch ? logoMatch[1] : '',
                        group: groupMatch ? groupMatch[1] : 'Khác',
                        name: nameMatch ? nameMatch.trim() : 'Kênh Không Tên'
                    };
                } else if (line.startsWith('http://') || line.startsWith('https://')) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = {};
                }
            });
            return channels;
        }

        // Render danh sách ra giao diện
        function renderChannels(channels) {
            channelListContainer.innerHTML = '';
            channels.forEach((ch, index) => {
                const card = document.createElement('div');
                card.className = 'channel-card' + (index === 0 ? ' active' : '');
                
                card.innerHTML = `
                    <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/45x30?text=TV'" alt="Logo">
                    <div class="channel-info">
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-group">${ch.group}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
                    card.classList.add('active');
                    playStream(ch.url);
                });

                channelListContainer.appendChild(card);
            });
        }

        // Chạy khi trang web được tải xong
        window.addEventListener('DOMContentLoaded', loadM3U);
    </script>
</body>
</html>
